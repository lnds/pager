# Observabilidad para Pager. Se usa encima del compose.yaml normal, con otro
# nombre de proyecto para no compartir contenedores ni datos con él:
#
#   docker compose -p pager-obs -f compose.yaml -f compose.observabilidad.yaml up -d --build
#
# o con el atajo ./observabilidad/obs iniciar.
#
# Los tres servicios se construyen con trazas de OpenTelemetry y las mandan al
# Collector, que las entrega a Jaeger y calcula con ellas las métricas que lee
# Prometheus. Grafana trae las fuentes de datos y el tablero configurados, y
# Locust genera la carga.
#
#   Locust      http://localhost:8089
#   Grafana     http://localhost:3000
#   Jaeger      http://localhost:16686
#   Prometheus  http://localhost:9090

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

services:
  incidents:
    build:
      context: ./services/incidents
      dockerfile: ../../observabilidad/incidents/Dockerfile
      additional_contexts:
        obs: ./observabilidad/incidents
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: incidents
      # FastAPI agrega por su cuenta un exportador OTLP cuando ve estas
      # variables. Las trazas ya las exporta otel_main.py: con «none» no se duplican.
      OTEL_TRACES_EXPORTER: none
    depends_on:
      otel-collector:
        condition: service_started

  catalog:
    build:
      context: ./services/catalog
      dockerfile: ../../observabilidad/catalog/Dockerfile
      additional_contexts:
        obs: ./observabilidad/catalog
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: catalog
    depends_on:
      otel-collector:
        condition: service_started

  notifications:
    build:
      context: ./services/notifications
      dockerfile: ../../observabilidad/notifications/Dockerfile
      additional_contexts:
        obs: ./observabilidad/notifications
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: notifications
    depends_on:
      otel-collector:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    # Como root para poder leer el socket de Docker, de donde sale el uso de
    # CPU y memoria de los contenedores.
    user: "0:0"
    volumes:
      - ./observabilidad/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "100000"
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observabilidad/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pager.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/tableros:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 60
    depends_on:
      prometheus:
        condition: service_healthy

  locust:
    image: locustio/locust:2.32.2
    command: ["-f", "/mnt/locust/locustfile.py", "--host", "http://incidents:8080", "--users", "20", "--spawn-rate", "2"]
    ports:
      - "127.0.0.1:8089:8089"
    volumes:
      - ./observabilidad/locust:/mnt/locust:ro
    depends_on:
      incidents:
        condition: service_healthy

volumes:
  prometheus-data:
